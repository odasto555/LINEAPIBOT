<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LINE API Console</title>
    <link rel="stylesheet" href="/console.css">
    <script src="/console.js" defer></script>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span> LINE API Console</div>
            <div class="identity" id="identity" hidden>
                <div class="identity-text"><strong id="username"></strong><span id="role"></span></div>
                <button type="button" id="logout" class="logout">ออกจากระบบ</button>
            </div>
        </aside>
        <main>
            <section id="login-page" class="login-page" aria-labelledby="login-heading">
                <div class="panel login-panel">
                    <h1 id="login-heading">เข้าสู่ระบบ</h1>
                    <p class="description">ใช้บัญชีแอดมินของ LINE API Console</p>
                    <form id="login-form" method="post" action="/v1/auth/login" class="form">
                        <label>ชื่อผู้ใช้<input name="username" autocomplete="username" maxlength="64" required></label>
                        <label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
                        <p id="login-error" class="message error" role="alert" hidden></p>
                        <button class="primary" type="submit">เข้าสู่ระบบ</button>
                    </form>
                </div>
            </section>

            <section id="monitor-page" aria-labelledby="monitor-heading" hidden>
                <header class="page-header monitor-header">
                    <div><h1 id="monitor-heading" tabindex="-1">Monitor</h1><p class="description">ติดตามงานของผู้ใช้และขั้นตอนที่เซิร์ฟเวอร์กำลังประมวลผล</p></div>
                    <button type="button" id="refresh" class="secondary">รีเฟรช</button>
                </header>
                <section class="panel" aria-labelledby="activity-title">
                    <div class="panel-heading activity-heading">
                        <div><h2 id="activity-title">งานจากผู้ใช้</h2><p class="hint" id="monitor-sync" role="status"></p></div>
                        <div id="filter" class="segments" role="group" aria-label="ตัวกรองสถานะงาน">
                            <button type="button" data-filter="active" aria-pressed="false">กำลังดำเนินการ</button>
                            <button type="button" data-filter="all" aria-pressed="true">งานล่าสุด</button>
                        </div>
                    </div>
                    <div class="table-wrap" tabindex="0" role="region" aria-label="ตารางงานจากผู้ใช้">
                        <table>
                            <thead><tr><th scope="col">ผู้ใช้</th><th scope="col">ประเภทงาน</th><th scope="col">สถานะ</th><th scope="col">ขั้นตอนล่าสุด</th><th scope="col">ส่งเมื่อ</th><th scope="col">อัปเดต</th><th scope="col">Job ID</th></tr></thead>
                            <tbody id="monitor-rows"></tbody>
                        </table>
                    </div>
                    <p id="monitor-empty" class="empty">ยังไม่มีงานในรายการ</p>
                </section>
            </section>
            <p id="app-error" class="message error" role="alert" hidden></p>
        </main>
    </div>
</body>
</html>
